<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sean Moore &middot; Portfolio</title>
    <meta name="description" content="Portfolio of Sean Moore, founder of [removed]. Operations, program, and product work, with four shipped products." />
    <meta name="theme-color" content="#04050a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304050a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%235b8cff'/%3E%3C/svg%3E" />
    <link rel="canonical" href="https://sean-moore-portfolio.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sean Moore &middot; Portfolio" />
    <meta property="og:description" content="Founder of [removed]. Operations, program, and product work, with four shipped products." />
    <meta property="og:url" content="https://sean-moore-portfolio.web.app/" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loader"><div class="loader-ring"></div></div>

    <header class="topbar">
      <button class="brand" data-scroll="top">
        <span class="brand-dot"></span>
        <span id="brand-name">Sean Moore</span>
      </button>
      <nav class="nav">
        <button data-scroll="about">About</button>
        <button data-scroll="work">Work</button>
        <button data-scroll="contact">Contact</button>
      </nav>
    </header>

    <main>
      <section id="hero" class="section" data-section="hero">
        <div class="wrap center">
          <p class="eyebrow">Portfolio</p>
          <h1 class="display" id="hero-name">Sean Moore</h1>
          <p class="lead" id="hero-tag">Founder of [removed]. Operations and product.</p>
        </div>
        <div class="scroll-cue">scroll<span>&darr;</span></div>
      </section>

      <section id="about" class="section" data-section="about">
        <div class="wrap right">
          <p class="eyebrow">About</p>
          <p class="big-text" id="about-text"></p>
        </div>
      </section>

      <section id="work" class="section" data-section="work">
        <div class="wrap left">
          <p class="eyebrow">Selected work</p>
          <p class="work-intro" id="work-intro"></p>
          <ul class="projects" id="projects"></ul>
        </div>
      </section>

      <section id="contact" class="section" data-section="contact">
        <div class="wrap center">
          <p class="eyebrow">Get in touch</p>
          <h2 class="display sm">Contact me!</h2>
          <p class="lead" id="contact-lead"></p>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
